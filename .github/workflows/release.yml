name: Build and Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v4

      - name: MSBuild Ortamını Hazırla
        uses: microsoft/setup-msbuild@v2

      - name: NuGet Paketlerini Geri Yükle
        uses: nuget/setup-nuget@v2

      - name: Projeyi Release Modunda Derle
        run: |
          nuget restore BiberSesCoz\BiberSesCoz.csproj
          msbuild BiberSesCoz\BiberSesCoz.csproj /p:Configuration=Release /p:Platform="AnyCPU" /p:OutputPath=bin\Release\

      - name: Çıktıyı ZIP Olarak Paketle
        run: |
          Compress-Archive -Path "BiberSesCoz\bin\Release\*" -DestinationPath "BiberSesCoz-Windows.zip" -Force

      - name: GitHub Release Oluştur ve Yükle
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BiberSesCoz-Windows.zip
            BiberSesCoz/bin/Release/BiberSesCoz.exe
          generate_release_notes: true